<!DOCTYPE html>
<html lang="tr" data-theme="dark" data-accent="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Zamanlayıcı</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="remote.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-shutdown" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 7a7.6 7.6 0 1 0 10.8 0"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M19.5 12.5a7.5 7.5 0 1 1-2.2-5.8"/><path d="M19.5 4v4.5H15"/></symbol>
      <symbol id="i-sleep" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
      <symbol id="i-hibernate" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5 12 6.5l2.5-2M9.5 19.5 12 17.5l2.5 2"/></symbol>
      <symbol id="i-logoff" viewBox="0 0 24 24"><path d="M9.5 20.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h3.5"/><path d="m15.5 16.5 4.5-4.5-4.5-4.5M20 12H9"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17v.01"/></symbol>
      <symbol id="i-duration" viewBox="0 0 24 24"><path d="M7 3.5h10M7 20.5h10M8 3.5v2.5c0 2.5 4 4 4 6s-4 3.5-4 6v2.5M16 3.5v2.5c0 2.5-4 4-4 6s4 3.5 4 6v2.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-idle" viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="17" rx="5"/><path d="M12 7.5v3"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19m0 0-3-3m3 3-3 3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5m0 0 3 3m-3-3 3-3"/></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.8 16a4.7 4.7 0 0 1 6.4 0"/><path d="M12 19.5v.01"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7M16.5 6.5l2.5 2.5M14 9l2 2"/></symbol>
    </defs>
  </svg>

  <div class="phone">
    <header class="p-head">
      <img src="icon.png" alt="" class="p-logo">
      <div class="p-titles">
        <b data-i18n="app.name">Zamanlayıcı</b>
        <span data-i18n="remote.from"></span>
      </div>
      <span class="state-pill" id="pill"></span>
    </header>

    <div class="p-banner" id="offlineBanner" hidden>
      <svg><use href="#i-wifi"/></svg><span data-i18n="remote.offline"></span>
    </div>

    <section class="p-msg" id="screenMsg" hidden>
      <div class="p-msg-icon"><svg><use id="msgIcon" href="#i-key"/></svg></div>
      <h2 id="msgTitle"></h2>
      <p id="msgDesc"></p>
    </section>

    <main id="screenMain" hidden>
      <!-- Çalışan zamanlayıcı -->
      <section class="p-running" id="running" hidden>
        <div class="p-ring">
          <svg class="dial" viewBox="0 0 300 300">
            <defs>
              <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" style="stop-color: var(--accent-2)"/>
                <stop offset="100%" style="stop-color: var(--accent)"/>
              </linearGradient>
            </defs>
            <g id="ticks"></g>
            <circle class="track" cx="150" cy="150" r="118"/>
            <circle class="arc" id="arc" cx="150" cy="150" r="118" pathLength="1000" stroke="url(#arcGrad)"/>
          </svg>
          <div class="dial-center">
            <div class="center-top" id="runTop"></div>
            <div class="digits" id="runDigits"></div>
            <div class="center-sub" id="runSub"></div>
          </div>
        </div>
        <div class="p-run-ctrls" id="runCtrls">
          <button class="ghost-btn" data-extend="5"><svg><use href="#i-plus"/></svg>5 <span data-i18n="unit.m"></span></button>
          <button class="ghost-btn" data-extend="15"><svg><use href="#i-plus"/></svg>15 <span data-i18n="unit.m"></span></button>
          <button class="ghost-btn" id="btnPause"></button>
        </div>
        <button class="danger-btn p-wide" id="btnCancel"><svg><use href="#i-x"/></svg><span data-i18n="btn.cancel"></span></button>
      </section>

      <!-- Kurulum -->
      <section class="p-setup" id="setupSec">
        <div class="section-label" data-i18n="section.what"></div>
        <div class="p-actions" id="actions"></div>

        <div class="modes" id="modes">
          <button data-mode="duration"><svg><use href="#i-duration"/></svg><span data-i18n="mode.duration"></span></button>
          <button data-mode="clock"><svg><use href="#i-clock"/></svg><span data-i18n="mode.clock"></span></button>
          <button data-mode="idle"><svg><use href="#i-idle"/></svg><span data-i18n="mode.idle"></span></button>
          <span class="mode-thumb" id="modeThumb"></span>
        </div>

        <div class="p-value">
          <div class="p-fields" data-for="duration">
            <label class="p-field"><input id="inH" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"><span data-i18n="unit.h"></span></label>
            <label class="p-field"><input id="inM" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"><span data-i18n="unit.m"></span></label>
          </div>
          <div class="p-fields" data-for="clock">
            <label class="p-field p-time"><input id="inT" type="time" step="60"></label>
          </div>
          <div class="p-fields" data-for="idle">
            <label class="p-field"><input id="inI" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"><span data-i18n="unit.m"></span></label>
          </div>
          <div class="p-sub" id="valueSub"></div>
        </div>

        <div class="chips" id="chips"></div>

        <label class="repeat-row" id="repeatRow" hidden>
          <input type="checkbox" id="repeat">
          <span class="box"><svg><use href="#i-check"/></svg></span>
          <svg class="rep-icon"><use href="#i-repeat"/></svg>
          <span data-i18n="repeat.daily"></span>
        </label>

        <button class="primary-btn p-wide" id="btnStart"><svg><use href="#i-play"/></svg><span id="startLabel"></span></button>
      </section>

      <section class="p-presets" id="presetsSec" hidden>
        <div class="section-label" data-i18n="presets.title"></div>
        <div class="list" id="presetList"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="i18n.js"></script>
  <script src="remote.js"></script>
</body>
</html>
