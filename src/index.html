<!DOCTYPE html>
<html lang="tr" data-accent="amber" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Zamanlayıcı</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-shutdown" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 7a7.6 7.6 0 1 0 10.8 0"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M19.5 12.5a7.5 7.5 0 1 1-2.2-5.8"/><path d="M19.5 4v4.5H15"/></symbol>
      <symbol id="i-sleep" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
      <symbol id="i-hibernate" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5 12 6.5l2.5-2M9.5 19.5 12 17.5l2.5 2"/></symbol>
      <symbol id="i-logoff" viewBox="0 0 24 24"><path d="M9.5 20.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h3.5"/><path d="m15.5 16.5 4.5-4.5-4.5-4.5M20 12H9"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.8M9.5 2.5h5"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5M12 7.5V12l3 2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h8.5M17.5 7H20M4 17h2.5M11.5 17H20"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></symbol>
      <symbol id="i-min" viewBox="0 0 24 24"><path d="M6.5 12h11"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.8 12.5a1.5 1.5 0 0 0 1.5 1.5h6.4a1.5 1.5 0 0 0 1.5-1.5L17.5 7M9.5 7V4.5h5V7"/></symbol>
      <symbol id="i-duration" viewBox="0 0 24 24"><path d="M7 3.5h10M7 20.5h10M8 3.5v2.5c0 2.5 4 4 4 6s-4 3.5-4 6v2.5M16 3.5v2.5c0 2.5-4 4-4 6s4 3.5 4 6v2.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-idle" viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="17" rx="5"/><path d="M12 7.5v3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17v.01"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19m0 0-3-3m3 3-3 3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5m0 0 3 3m-3-3 3-3"/></symbol>
      <symbol id="i-mini" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><rect x="11.5" y="11.5" width="7" height="5" rx="1.2"/></symbol>
      <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 4.5 6.5v5c0 4.6 3.1 8.1 7.5 9.5 4.4-1.4 7.5-4.9 7.5-9.5v-5z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11.5A8 8 0 0 0 6 6.5L4 8.5M4 4v4.5h4.5M4 12.5a8 8 0 0 0 14 5l2-2m0 4.5v-4.5h-4.5"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <img src="../assets/icon.png" alt="" class="brand-icon">
        <span data-i18n="app.name">Zamanlayıcı</span>
        <span class="state-pill" id="statePill"></span>
      </div>
      <div class="win-controls">
        <button class="win-btn" id="btnMin" data-i18n-title="btn.min"><svg><use href="#i-min"/></svg></button>
        <button class="win-btn close" id="btnClose" data-i18n-title="btn.close"><svg><use href="#i-close"/></svg></button>
      </div>
    </header>

    <main class="views">
      <!-- ============ ZAMANLAYICI ============ -->
      <section class="view active" id="view-timer">
        <div class="setup" id="setup">
          <div class="section-label" data-i18n="section.what"></div>
          <div class="actions" id="actions"></div>

          <div class="modes" id="modes" role="tablist">
            <button data-mode="duration" class="active"><svg><use href="#i-duration"/></svg><span data-i18n="mode.duration"></span></button>
            <button data-mode="clock"><svg><use href="#i-clock"/></svg><span data-i18n="mode.clock"></span></button>
            <button data-mode="idle"><svg><use href="#i-idle"/></svg><span data-i18n="mode.idle"></span></button>
            <span class="mode-thumb" id="modeThumb"></span>
          </div>
        </div>

        <div class="dial-wrap">
          <svg class="dial" id="dial" viewBox="0 0 300 300">
            <defs>
              <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" style="stop-color: var(--accent-2)"/>
                <stop offset="100%" style="stop-color: var(--accent)"/>
              </linearGradient>
            </defs>
            <g id="ticks"></g>
            <circle class="track" cx="150" cy="150" r="118"/>
            <circle class="arc" id="arc" cx="150" cy="150" r="118" pathLength="1000" stroke="url(#arcGrad)"/>
            <circle class="knob" id="knob" cx="150" cy="32" r="12"/>
          </svg>
          <div class="dial-center">
            <div class="center-top" id="centerTop"></div>
            <div class="digits" id="digits"></div>
            <div class="center-sub" id="centerSub"></div>
          </div>
        </div>

        <div class="chips" id="chips"></div>

        <div class="run-controls" id="runControls" hidden>
          <button class="ghost-btn" data-extend="5"><svg><use href="#i-plus"/></svg>5 <span data-i18n="unit.m"></span></button>
          <button class="ghost-btn" data-extend="15"><svg><use href="#i-plus"/></svg>15 <span data-i18n="unit.m"></span></button>
          <button class="ghost-btn" id="btnPause"></button>
          <button class="ghost-btn square" id="btnMini" data-i18n-title="btn.mini"><svg><use href="#i-mini"/></svg></button>
        </div>

        <div class="primary-row">
          <button class="primary-btn" id="btnStart">
            <svg><use href="#i-play"/></svg>
            <span id="startLabel"></span>
          </button>
          <button class="icon-btn" id="btnSavePreset" data-i18n-title="btn.savePreset"><svg><use href="#i-bookmark"/></svg></button>
          <button class="danger-btn" id="btnCancel" hidden><svg><use href="#i-x"/></svg><span data-i18n="btn.cancel"></span></button>
        </div>
        <label class="repeat-row" id="repeatRow" hidden>
          <input type="checkbox" id="repeat">
          <span class="box"><svg><use href="#i-check"/></svg></span>
          <svg class="rep-icon"><use href="#i-repeat"/></svg>
          <span data-i18n="repeat.daily"></span>
        </label>
        <div class="hint" id="hint" data-i18n="hint.dial"></div>
      </section>

      <!-- ============ ÖN AYARLAR ============ -->
      <section class="view" id="view-presets">
        <div class="view-head">
          <div>
            <h1 data-i18n="presets.title"></h1>
            <p data-i18n="presets.desc"></p>
          </div>
          <button class="ghost-btn small" id="btnAddPreset"><svg><use href="#i-plus"/></svg><span data-i18n="btn.new"></span></button>
        </div>
        <div class="list" id="presetList"></div>
      </section>

      <!-- ============ GEÇMİŞ ============ -->
      <section class="view" id="view-history">
        <div class="view-head">
          <div>
            <h1 data-i18n="history.title"></h1>
            <p data-i18n="history.desc"></p>
          </div>
          <button class="ghost-btn small" id="btnClearHistory"><svg><use href="#i-trash"/></svg><span data-i18n="btn.clear"></span></button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="list" id="historyList"></div>
      </section>

      <!-- ============ AYARLAR ============ -->
      <section class="view" id="view-settings">
        <div class="view-head">
          <div>
            <h1 data-i18n="settings.title"></h1>
            <p data-i18n="settings.desc"></p>
          </div>
        </div>

        <div class="group">
          <div class="group-title" data-i18n="grp.appearance"></div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.language"></b><span data-i18n="set.languageDesc"></span></div>
            <div class="select-wrap"><select id="language" data-setting-select="language"></select></div>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.theme"></b><span data-i18n="set.themeDesc"></span></div>
            <div class="seg" data-setting="theme" data-type="string">
              <button data-v="system" data-i18n="theme.system"></button>
              <button data-v="light" data-i18n="theme.light"></button>
              <button data-v="dark" data-i18n="theme.dark"></button>
              <button data-v="oled" data-i18n="theme.oled"></button>
            </div>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.accent"></b><span data-i18n="set.accentDesc"></span></div>
            <div class="swatches" id="swatches"></div>
          </div>
        </div>

        <div class="group">
          <div class="group-title" data-i18n="grp.warnings"></div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.warning"></b><span data-i18n="set.warningDesc"></span></div>
            <div class="seg" data-setting="warningSeconds">
              <button data-v="30">30 s</button><button data-v="60">1 m</button><button data-v="120">2 m</button>
            </div>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.notify"></b><span data-i18n="set.notifyDesc"></span></div>
            <div class="seg" data-setting="notifyMinutes">
              <button data-v="0" data-i18n="off"></button><button data-v="5">5 m</button><button data-v="10">10 m</button>
            </div>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.sound"></b><span data-i18n="set.soundDesc"></span></div>
            <label class="toggle"><input type="checkbox" data-setting="sound"><span></span></label>
          </div>
        </div>

        <div class="group">
          <div class="group-title" data-i18n="grp.behavior"></div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.mini"></b><span data-i18n="set.miniDesc"></span></div>
            <label class="toggle"><input type="checkbox" data-setting="miniAuto"><span></span></label>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.force"></b><span data-i18n="set.forceDesc"></span></div>
            <label class="toggle"><input type="checkbox" data-setting="forceClose"><span></span></label>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.tray"></b><span data-i18n="set.trayDesc"></span></div>
            <label class="toggle"><input type="checkbox" data-setting="closeToTray"><span></span></label>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.startup"></b><span data-i18n="set.startupDesc"></span></div>
            <label class="toggle"><input type="checkbox" data-setting="launchAtStartup"><span></span></label>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.global"></b><span data-i18n="set.globalDesc"></span></div>
            <label class="toggle"><input type="checkbox" data-setting="globalShortcuts"><span></span></label>
          </div>
          <div class="row">
            <div class="row-text"><b data-i18n="set.updates"></b><span data-i18n="set.updatesDesc"></span></div>
            <label class="toggle"><input type="checkbox" data-setting="checkUpdates"><span></span></label>
          </div>
        </div>

        <div class="group">
          <div class="group-title" data-i18n="grp.shortcuts"></div>
          <div class="shortcuts">
            <div><kbd>Enter</kbd><span data-i18n="kbd.start"></span></div>
            <div><kbd>Esc</kbd><span data-i18n="kbd.cancel"></span></div>
            <div><kbd>1</kbd>–<kbd>6</kbd><span data-i18n="kbd.action"></span></div>
            <div><kbd>↑</kbd><kbd>↓</kbd><span data-i18n="kbd.adjust"></span>&nbsp;<small data-i18n="kbd.shift"></small></div>
          </div>
        </div>

        <div class="group">
          <div class="group-title" data-i18n="grp.about"></div>
          <div class="about-card">
            <div class="about-top">
              <img src="../assets/icon.png" alt="" class="about-icon">
              <div class="row-text">
                <b id="version"></b>
                <span class="trust"><svg><use href="#i-shield"/></svg><span data-i18n="about.license"></span></span>
              </div>
            </div>
            <div class="about-status" id="updateStatus"></div>
            <div class="about-actions">
              <button class="ghost-btn small" id="btnRepo"><svg><use href="#i-github"/></svg><span data-i18n="about.source"></span></button>
              <button class="ghost-btn small" id="btnCheck"><svg><use href="#i-refresh"/></svg><span data-i18n="about.check"></span></button>
              <button class="ghost-btn small danger" id="btnQuit"><span data-i18n="btn.quit"></span></button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button data-view="timer" class="active"><svg><use href="#i-timer"/></svg><span data-i18n="nav.timer"></span></button>
      <button data-view="presets"><svg><use href="#i-bookmark"/></svg><span data-i18n="nav.presets"></span></button>
      <button data-view="history"><svg><use href="#i-history"/></svg><span data-i18n="nav.history"></span></button>
      <button data-view="settings"><svg><use href="#i-settings"/></svg><span data-i18n="nav.settings"></span></button>
    </nav>
  </div>

  <div class="modal" id="modal" hidden>
    <form class="modal-card" id="modalForm">
      <h2 data-i18n="modal.title"></h2>
      <p id="modalDesc"></p>
      <input type="text" id="modalInput" maxlength="40" data-i18n-ph="presets.placeholder" autocomplete="off">
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="modalCancel" data-i18n="btn.dismiss"></button>
        <button type="submit" class="primary-btn small" data-i18n="btn.save"></button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
