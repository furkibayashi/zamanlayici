# Bu iş akışı .exe dosyasını GitHub'ın kendi sunucularında, bu depodaki
# açık kaynak koddan derler. Derleme kayıtları herkese açıktır ve her exe için
# GitHub imzalı bir "build provenance" (köken) kanıtı üretilir.
name: Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build portable exe
        run: npx electron-builder --win --publish never

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter 'Zamanlayici-*.exe'
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/Zamanlayici-*.exe'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zamanlayici-windows
          path: |
            dist/Zamanlayici-*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Zamanlayici-*.exe dist/SHA256SUMS.txt \
            --title "Zamanlayıcı $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
